<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMF - Sociedade Esportiva Mais Futuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo SEMF" class="logo-site">
                <span>MAIS FUTURO</span>
            </a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('transparencia') }}">Transparência</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('pagamentos') }}">Pagamentos</a></li>
                    <li class="nav-item"><a class="btn-semf py-2 ms-lg-3" href="{{ url_for('inscricao') }}">MATRÍCULA</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <div class="container">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" style="height: 50px; margin-bottom: 20px;">
            <p><strong>Sociedade Esportiva Mais Futuro</strong></p>
            <p class="small text-muted">Campo Novo de Rondônia - RO</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
