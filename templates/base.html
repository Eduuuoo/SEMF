<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMF - Mais Futuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='logo.jpg') }}" class="logo-img" alt="Logo SEMF">
                <span>SEMF ASSOCIAÇÃO MAIS FUTURO</span>
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link me-3" href="{{ url_for('home') }}">Início</a>
                <a class="nav-link me-3" href="{{ url_for('transparencia') }}">Transparência</a>
                <a class="nav-link me-3" href="{{ url_for('pagamentos') }}">Pagamentos</a>
                <a class="btn-semf" href="{{ url_for('inscricao') }}">MATRÍCULA</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer>
        <p>© 2026 Associação Esportiva Mais Futuro - Campo Novo de Rondônia</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
