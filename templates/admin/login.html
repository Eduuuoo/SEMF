<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — SEMF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    </style>
</head>
<body>
<div style="width:100%; max-width:380px; padding: 0 16px;">
    <div class="card-dark text-center">
        <p style="font-family:'Barlow Condensed',sans-serif; font-size:0.75rem; letter-spacing:2.5px; text-transform:uppercase; color:var(--turquesa); margin-bottom:4px;">Área Restrita</p>
        <h2 class="fw-bold mb-4" style="color:var(--texto-branco);">ADMIN SEMF</h2>

        {% if erro %}
        <div class="alert-form-erro mb-3">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">Usuário</label>
                <input type="text" name="usuario" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-semf w-100" style="font-size:1rem; padding:13px;">ENTRAR</button>
        </form>
    </div>
    <p class="text-center mt-3" style="font-size:0.8rem;">
        <a href="{{ url_for('home') }}" style="color:var(--texto-mutado); text-decoration:none;">← Voltar ao site</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
