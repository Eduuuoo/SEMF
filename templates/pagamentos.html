{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="card-dark">
        <p style="font-family:'Barlow Condensed',sans-serif; font-size:0.78rem; letter-spacing:2px; text-transform:uppercase; color:var(--turquesa); margin-bottom:6px;">Portal Financeiro</p>
        <h2 class="fw-bold mb-2" style="color: var(--texto-branco);">ÁREA DE PAGAMENTOS</h2>
        <p class="text-muted mb-4">Gere sua mensalidade ou contribua com a SEMF diretamente por aqui.</p>
        <hr style="border-color:#1e1e1e;">

        <div class="row g-4 mt-2">
            <div class="col-md-6">
                <h4 class="fw-bold mb-3 text-white">Emitir Mensalidade</h4>
                <div class="mb-3">
                    <label class="form-label">CPF do Atleta ou Responsável</label>
                    <input type="text" id="cpf-pagamento" class="form-control" placeholder="000.000.000-00">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de Cobrança</label>
                    <select id="categoria-pagamento" class="form-select">
                        <option>Mensalidade Futebol de Campo (R$ 50,00)</option>
                        <option>Mensalidade Futsal (R$ 50,00)</option>
                        <option>Contribuição Voluntária / Doação</option>
                    </select>
                </div>
                <button type="button" class="btn-semf w-100" onclick="simularPagamento()">
                    GERAR COBRANÇA
                </button>
            </div>

            <div class="col-md-6">
                <h4 class="fw-bold mb-3 text-white">Cobrança Gerada</h4>
                <div id="area-pagamento-ativa" class="p-4 rounded text-center"
                     style="background:#0a0a0a; border:1px solid #1e1e1e; min-height:120px;">
                    <p class="text-muted small" style="margin:auto; padding-top:16px;">
                        Preencha os dados ao lado para gerar o PIX.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function simularPagamento() {
    const cpf  = document.getElementById('cpf-pagamento').value.trim();
    const area = document.getElementById('area-pagamento-ativa');
    if (!cpf) {
        area.innerHTML = '<p style="color:var(--vermelho); padding-top:16px;">⚠ Informe o CPF antes de continuar.</p>';
        return;
    }
    area.innerHTML = `
        <h5 style="color:var(--laranja);" class="fw-bold">COBRANÇA GERADA COM SUCESSO</h5>
        <p class="small text-muted my-2">Escaneie o QR Code ou copie o código PIX:</p>
        <div class="bg-white d-inline-block p-2 rounded mb-3">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=SEMF_Pix_Simulado" alt="QR Code PIX">
        </div><br>
        <input type="text" class="form-control text-center mb-2"
               style="background:#1a1a1a;color:#fff;border-color:#444;font-size:0.78rem;"
               value="00020101021126305500..." readonly>
        <button class="btn-admin w-100" onclick="navigator.clipboard.writeText('00020101021126305500...')">
            Copiar Código PIX
        </button>
    `;
}
</script>
{% endblock %}
