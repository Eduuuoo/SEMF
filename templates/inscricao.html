{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card-form">
                <h2 class="fw-bold mb-4" style="color: var(--primary);">FICHA DE MATRÍCULA</h2>
                <form action="{{ url_for('inscricao') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome do Atleta</label>
                        <input type="text" name="nome" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">CPF</label>
                            <input type="text" name="cpf" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Data de Nascimento</label>
                            <input type="date" name="data" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">WhatsApp do Responsável</label>
                        <input type="text" name="tel" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-semf w-100">ENVIAR SOLICITAÇÃO</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
