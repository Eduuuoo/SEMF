{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <div class="card-dark">
        <p style="font-family:'Barlow Condensed',sans-serif; font-size:0.78rem; letter-spacing:2px; text-transform:uppercase; color:var(--turquesa); margin-bottom:6px;">Prestação de Contas</p>
        <h2 class="fw-bold mb-2" style="color: var(--texto-branco);">PORTAL DA TRANSPARÊNCIA</h2>
        <p class="text-muted mb-4">Lançamentos financeiros oficiais da Associação Esportiva Mais Futuro.</p>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th style="color: var(--laranja);">Data</th>
                        <th style="color: var(--laranja);">Descrição</th>
                        <th style="color: var(--laranja);">Valor</th>
                    </tr>
                </thead>
                <tbody>
                    {% for g in gastos %}
                    <tr>
                        <td>{{ g.data }}</td>
                        <td>{{ g.descricao }}</td>
                        <td style="color:#ff6b6b; font-weight:600;">- {{ g.valor }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
